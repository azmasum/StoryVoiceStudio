[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyvoice-studio"
version = "0.2.0"
description = "AI storytelling audio production studio for Windows with Gemini neural voices, emotional narration, background music and professional audio mastering."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "StoryVoice Studio Contributors" }]
keywords = ["tts", "storytelling", "audio", "narration", "gemini"]

[project.scripts]
storyvoice = "cli.main:main"

[tool.setuptools]
packages = [
    "app", "app.config", "app.core", "app.ui", "app.workers", "app.utils",
    "audio", "audio.dsp", "audio.mixer", "audio.mastering", "audio.waveform", "audio.analysis",
    "tts", "tts.providers", "tts.voices",
    "emotion",
    "script",
    "music",
    "sfx",
    "timeline",
    "models",
    "project",
    "export",
    "cli",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
